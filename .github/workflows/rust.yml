name: Project CI

concurrency:
  group: fmt-quantum-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [clone01]
  pull_request:
    branches: [clone01]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets
      - name: Upload Cargo lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-lockfile
          path: Cargo.lock
          if-no-files-found: warn

  gmx-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gmx-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --package-lock-only && npm ci; fi
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Upload GMX adapter lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmx-adapter-lockfile
          path: services/gmx-adapter/package-lock.json
          if-no-files-found: warn

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build dashboard
        run: npm run build
      - name: Upload dashboard lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-lockfile
          path: apps/web/package-lock.json
          if-no-files-found: warn
