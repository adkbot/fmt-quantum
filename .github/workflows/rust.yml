name: Project CI

permissions:
  contents: write

concurrency:
  group: fmt-quantum-${{ github.run_id }}
  cancel-in-progress: false

on:
  push:
    branches: [clone01]

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clone01
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate reproducible lockfiles
        run: |
          cargo generate-lockfile
          cd services/gmx-adapter
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || echo "Review unresolved GMX adapter dependency advisories."
          cd ../../apps/web
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || echo "Review unresolved dashboard dependency advisories."
      - name: Commit lockfiles when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock services/gmx-adapter/package-lock.json apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already up to date."
          else
            git commit -m "chore(deps): commit reproducible lockfiles [skip ci]"
            git fetch origin clone01
            git rebase origin/clone01
            git push origin HEAD:clone01
          fi

  rust:
    needs: lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clone01
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets
      - name: Upload Cargo lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-lockfile
          path: Cargo.lock
          if-no-files-found: warn

  gmx-adapter:
    needs: lockfiles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gmx-adapter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clone01
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --package-lock-only && npm ci; fi
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Upload GMX adapter lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmx-adapter-lockfile
          path: services/gmx-adapter/package-lock.json
          if-no-files-found: warn

  docker:
    needs: lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clone01
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build Rust API and worker image
        run: docker build -f Dockerfile.rust -t fmt-quantum-rust .
      - name: Build GMX read-only adapter image
        run: docker build -f services/gmx-adapter/Dockerfile -t fmt-quantum-gmx-adapter ./services/gmx-adapter
      - name: Build Next.js dashboard image
        run: |
          docker build -f apps/web/Dockerfile -t fmt-quantum-web ./apps/web \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=public-placeholder \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8080

  web:
    needs: lockfiles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clone01
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --package-lock-only && npm ci; fi
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build dashboard
        run: npm run build
      - name: Upload dashboard lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-lockfile
          path: apps/web/package-lock.json
          if-no-files-found: warn
